name: CD

on:
  push:
    branches: [ "main", "develop", "cicd" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules via token)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_ACTION_TOKEN }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build (bootJar)
        run: ./gradlew clean bootJar -Pprofile=dev --no-daemon

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push image (tag=SHA)
        run: |
          docker buildx build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ github.sha }} \
            --push .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout (with submodules via token)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_ACTION_TOKEN }}
          submodules: recursive

      # 인프라/앱 compose 세트 모두 전송
      - name: Copy compose & configs to Server
        uses: appleboy/scp-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          port:     ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          source:   "docker-compose.infra.yml,docker-compose.app-green.yml,docker-compose.app-blue.yml,prometheus.yml"
          target:   "~/app"

      - name: Deploy GREEN (no-downtime)
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          port:     ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ~/app

            echo "📄 Write .env"
            printf "%s" "${{ secrets.ENV_FILE }}" > .env

            # 공통 환경변수 (compose 파일에서 참조)
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            export DOCKER_REPO="${{ secrets.DOCKER_REPO }}"
            export IMAGE_TAG="${{ github.sha }}"
            export SPRING_PROFILES_ACTIVE=dev
            export SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}"
            export SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}"
            export SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}"

            echo "🏗️ Ensure infra up (idempotent)"
            docker compose -f docker-compose.infra.yml up -d

            echo "🟢 Launch/Update GREEN"
            docker compose -f docker-compose.app-green.yml pull
            docker compose -f docker-compose.app-green.yml up -d

            echo "🩺 Wait GREEN health"
            for i in {1..30}; do
              if docker exec danchu-green sh -c "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"; then
                echo "GREEN is healthy ✅"; break; fi
              echo "waiting health... ($i/30)"; sleep 3
              if [ "$i" -eq 30 ]; then echo "GREEN unhealthy ❌"; exit 1; fi
            done

            echo "🔁 Switch NGINX upstream -> GREEN"
            sudo /usr/local/bin/switch_upstream.sh green

            echo "🧪 Smoke test (public)"
            curl -fsSI https://api.danchu.site/ | head -n 1

            echo "🧹 Optional: remove old BLUE later for rollback safety"
            # docker compose -f docker-compose.app-blue.yml down

      - name: Prune dangling images (optional)
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          port:     ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: docker image prune -f